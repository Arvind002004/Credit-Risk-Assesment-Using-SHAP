<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Analyzer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-mesh"></div>
    <div class="glow-bg"></div>

    <div class="dashboard-wrapper">
        <header class="main-header">
            <div class="brand">
                <span class="pulse-dot"></span>
                <h1>CREDIT RISK <span>ANALYZER</span></h1>
            </div>
            <p class="subtitle">Fintech AI-powered risk scoring model</p>
        </header>

        <div class="dashboard-grid">
            <!-- LEFT COLUMN: INPUT FORM -->
            <section class="card form-section">
                <div class="card-header">
                    <h2>APPLICANT DETAILS</h2>
                    <span class="section-tag">input form</span>
                </div>
                
                <form id="prediction-form">
                    <div class="form-grid">
                        <div class="input-group">
                            <label for="person_age">Age</label>
                            <input type="number" id="person_age" required min="18" max="120" placeholder="e.g. 28">
                        </div>
                        <div class="input-group">
                            <label for="person_income">Annual Income ($)</label>
                            <input type="number" id="person_income" required placeholder="e.g. 60000">
                        </div>
                        <div class="input-group">
                            <label for="person_home_ownership">Home Ownership</label>
                            <select id="person_home_ownership" required>
                                <option value="" disabled selected>Select option</option>
                                <option value="RENT">Rent</option>
                                <option value="OWN">Own</option>
                                <option value="MORTGAGE">Mortgage</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="person_emp_length">Employment Length (Yrs)</label>
                            <input type="number" id="person_emp_length" required placeholder="e.g. 5">
                        </div>
                        <div class="input-group">
                            <label for="loan_intent">Loan Intent</label>
                            <select id="loan_intent" required>
                                <option value="" disabled selected>Select purpose</option>
                                <option value="PERSONAL">Personal</option>
                                <option value="EDUCATION">Education</option>
                                <option value="MEDICAL">Medical</option>
                                <option value="VENTURE">Venture</option>
                                <option value="HOMEIMPROVEMENT">Home Improvement</option>
                                <option value="DEBTCONSOLIDATION">Debt Consolidation</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="loan_grade">Loan Grade</label>
                            <select id="loan_grade" required>
                                <option value="" disabled selected>Select grade</option>
                                <option value="A">A (Lowest Risk)</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="G">G (Highest Risk)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="loan_amnt">Loan Amount ($)</label>
                            <input type="number" id="loan_amnt" required placeholder="e.g. 15000">
                        </div>
                        <div class="input-group">
                            <label for="loan_int_rate">Interest Rate (%)</label>
                            <input type="number" id="loan_int_rate" step="0.01" required placeholder="e.g. 10.5">
                        </div>
                        <div class="input-group">
                            <label for="loan_percent_income">Loan % of Income</label>
                            <input type="number" id="loan_percent_income" step="0.01" max="1" required placeholder="e.g. 0.25">
                        </div>
                        <div class="input-group">
                            <label for="cb_person_cred_hist_length">Credit History Length</label>
                            <input type="number" id="cb_person_cred_hist_length" required placeholder="e.g. 7">
                        </div>
                        <div class="input-group full-width">
                            <label for="cb_person_default_on_file">Historical Default on File?</label>
                            <select id="cb_person_default_on_file" required>
                                <option value="N" selected>No (N)</option>
                                <option value="Y">Yes (Y)</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="analyze-btn">
                        <span class="btn-text">Analyze Risk</span>
                        <div class="btn-glow"></div>
                    </button>
                </form>
            </section>

            <!-- RIGHT COLUMN: DYNAMIC RISK METER -->
            <section class="card result-section">
                <div class="card-header">
                    <h2>RISK ANALYSIS HUB</h2>
                    <span class="section-tag" id="status-tag">standby</span>
                </div>

                <div class="meter-wrapper">
                    <div class="radar-scan" id="radar"></div>
                    
                    <!-- SVG Gauge -->
                    <div class="gauge-container">
                        <svg class="gauge" viewBox="0 0 200 120">
                            <!-- Background Arc -->
                            <path class="gauge-bg" d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
                            <!-- Colored Glowing Arc (Gradient used visually) -->
                            <path class="gauge-fill" id="gauge-fill" d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke="url(#gauge-grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="251" />
                            
                            <defs>
                                <linearGradient id="gauge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#10b981" />   <!-- Emerald Green -->
                                    <stop offset="50%" stop-color="#eab308" />  <!-- Warning Yellow -->
                                    <stop offset="100%" stop-color="#ef4444" /> <!-- Danger Red -->
                                </linearGradient>
                            </defs>
                        </svg>

                        <!-- Gauge Needle -->
                        <div class="needle-center"></div>
                        <div class="gauge-needle" id="gauge-needle"></div>
                    </div>

                    <div class="score-display">
                        <p class="score-label">Risk Probability</p>
                        <h3 class="score-value" id="score-val">0.0%</h3>
                    </div>
                </div>

                <!-- Live Risk Status -->
                <div class="analysis-status-wrapper">
                    <div class="status-alert default-state" id="risk-alert">
                        <div class="alert-icon">⚡</div>
                        <div class="alert-info">
                            <h4 id="risk-grade-title">System Ready</h4>
                            <p id="risk-grade-desc">Fill out the applicant details to predict credit risk default probability.</p>
                        </div>
                    </div>
                </div>

                <!-- Mini Analytics Dashboard Grid -->
                <div class="analytics-subgrid">
                    <div class="meta-box">
                        <span class="meta-label">THRESHOLD</span>
                        <span class="meta-value" id="meta-thresh">-</span>
                    </div>
                    <div class="meta-box">
                        <span class="meta-label">STATUS</span>
                        <span class="meta-value id-pulsing" id="meta-status">Standby</span>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
